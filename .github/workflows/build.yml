# Builds the bridge and runs every test group with Lua 5.3, 5.4 and 5.5, on
# Linux, macOS (arm64 and x64) and Windows: one job per platform and Lua,
# since the bridge is compiled against one Lua. ooRexx comes from its
# portable builds on SourceForge, pinned to one revision; a newer one is
# taken deliberately, after checking it. Except on Linux: there ooRexx is
# built from SVN with the fixes in patches/oorexx/ (ooRexx bugs reported but
# not yet in trunk, that the bridge's tests need; scripts/setup-oorexx.sh,
# cached), and ORXLUA_OOREXX_FIXES=1 says so to the tests. Run by hand
# (workflow_dispatch) with oorexx_fixes, every platform builds it. Lua: on Linux, 5.3 and 5.4 are the
# distribution's (shared liblua, through pkg-config); everything else is
# built from lua.org's sources by scripts/setup-lua.sh, pinned to a release
# (static on Linux and macOS, a DLL on Windows).
#
# The Lua 5.3 jobs also run the tests of the Lua module (tests/lua) in TeX
# Live's own LuaTeX (texlua, from CTAN: scripts/setup-luatex.sh), the Lua the
# module is most wanted in; on Windows with build.sh's texlive/ module.
#
# Each job's build is then packaged as a zip of binaries with its Lua inside
# (scripts/package.sh; artifacts oorexxlua-<platform>-lua<X.Y>), which is
# checked unzipped, as a user would install it: twelve packages. On Linux the
# package is a second, static build (LUA_STATIC=1), tested as the first. A tag
# vX.Y.Z[-suffix] (git tag v0.1.0 && git push origin v0.1.0) also makes a
# GitHub release with the twelve zips; pushes to main publish nothing.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      oorexx_fixes:
        description: ooRexx with the fixes in patches/oorexx/ on every platform, not only on Linux
        type: boolean
        default: false

env:
  OOREXX_REV: "13268"
  OOREXX_URL: https://downloads.sourceforge.net/project/oorexx/oorexx/5.3.0beta/portable
  OOREXX_FIXES_REV: "13269"     # the revision patches/oorexx/ is made against

jobs:
  unix:
    name: ${{ matrix.platform.name }} lua${{ matrix.lua }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x64
            os: ubuntu-24.04
            oorexx: ubuntu2404.x86_64
          - name: macos-arm64
            os: macos-14
            oorexx: macos.arm64.x86_64
          # Intel: the last x86_64 macOS image GitHub offers (until fall 2027);
          # ooRexx's macOS portable build is universal
          - name: macos-x64
            os: macos-15-intel
            oorexx: macos.arm64.x86_64
        lua: ["5.3.6", "5.4.9", "5.5.1"]
    runs-on: ${{ matrix.platform.os }}
    env:
      LUA_RELEASE: ${{ matrix.lua }}
      OOREXX_FIXES: ${{ matrix.platform.name == 'linux-x64' || inputs.oorexx_fixes == true }}
    steps:
      - uses: actions/checkout@v4
      - name: ooRexx r${{ env.OOREXX_FIXES_REV }} with the fixes, cached
        if: env.OOREXX_FIXES == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oorexx-inst
          key: oorexx-${{ runner.os }}-${{ runner.arch }}-r${{ env.OOREXX_FIXES_REV }}-${{ hashFiles('patches/oorexx/*.diff', 'scripts/setup-oorexx.sh') }}
      - name: ooRexx r${{ env.OOREXX_FIXES_REV }} with the fixes (built)
        if: env.OOREXX_FIXES == 'true'
        run: |
          export OOREXX_REV=$OOREXX_FIXES_REV OOREXX_INST=$RUNNER_TEMP/oorexx-inst
          export OOREXX_SRC=$RUNNER_TEMP/oorexx-src OOREXX_BUILD=$RUNNER_TEMP/oorexx-build
          scripts/setup-oorexx.sh >> "$GITHUB_PATH"
          echo "ORXLUA_OOREXX_FIXES=1" >> "$GITHUB_ENV"
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        if: env.OOREXX_FIXES != 'true'
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.${{ matrix.platform.oorexx }}-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.${{ matrix.platform.oorexx }}-portable-release/bin" >> "$GITHUB_PATH"
      - name: macOS tools (coreutils' timeout)
        if: runner.os == 'macOS'
        run: brew install -q coreutils
      - run: rexx -v
      - name: Lua ${{ matrix.lua }}
        run: |
          V=${LUA_RELEASE%.*}; echo "LUA_VERSION=$V" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Linux ] && [ "$V" != 5.5 ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq "liblua$V-dev"
            pkg-config --modversion "lua$V"
          fi
          scripts/setup-lua.sh "$LUA_RELEASE"     # the package's Lua (on Linux 5.3 and 5.4, too)
      - name: ooRexxUnit
        run: scripts/setup-oorexxunit.sh
      - name: Build
        run: scripts/build.sh
      - name: Tests
        run: OUT=$RUNNER_TEMP/tests tests/run.sh
      - name: The Lua module in TeX Live's LuaTeX (Lua 5.3)
        if: env.LUA_VERSION == '5.3'
        run: |
          TEXLUA=$(scripts/setup-luatex.sh); "$TEXLUA" --version | head -1 || true
          LUA_EXE=$TEXLUA TESTS="Module.test.lua Lifetime.test.lua" OUT=$RUNNER_TEMP/tests-luatex tests/run.sh
      - name: The package's build (Linux, 5.3 and 5.4 - static, not the distribution's liblua) and its tests
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ "$LUA_VERSION" != 5.5 ]; then
            export LUA_STATIC=1 BUILD=$RUNNER_TEMP/build-static
            scripts/build.sh
            OUT=$RUNNER_TEMP/tests-static tests/run.sh
            echo "PKG_BUILD=$BUILD" >> "$GITHUB_ENV"
          fi
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export ORXLUA_VERSION=${GITHUB_REF_NAME#v}; fi
          LUA_STATIC=1 BUILD=${PKG_BUILD:-$(cd .. && pwd)/build} scripts/package.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: oorexxlua-${{ matrix.platform.name }}-lua${{ env.LUA_VERSION }}
          path: ${{ runner.temp }}/dist/*.zip
      - name: The package, unzipped
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          unzip -q "$RUNNER_TEMP"/dist/*.zip
          D=$PWD/oorexxlua
          if [ "$RUNNER_OS" = macOS ]; then export DYLD_LIBRARY_PATH=$D; else export LD_LIBRARY_PATH=$D; fi
          cd .. && REXX_PATH=$D rexx "$D/check.rex"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true         # the logs are a help: GitHub's storage failing is not a test failing
        with:
          name: test-logs-${{ matrix.platform.name }}-lua${{ matrix.lua }}
          path: ${{ runner.temp }}/tests*

  # The same scripts, in Git Bash, with MSVC's developer environment
  windows:
    name: windows-x64 lua${{ matrix.lua }}
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.3.6", "5.4.9", "5.5.1"]
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      LUA_RELEASE: ${{ matrix.lua }}
      OOREXX_FIXES: ${{ inputs.oorexx_fixes == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: ooRexx r${{ env.OOREXX_FIXES_REV }} with the fixes, cached
        if: env.OOREXX_FIXES == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oorexx-inst
          key: oorexx-${{ runner.os }}-${{ runner.arch }}-r${{ env.OOREXX_FIXES_REV }}-${{ hashFiles('patches/oorexx/*.diff', 'scripts/setup-oorexx.sh') }}
      - name: ooRexx r${{ env.OOREXX_FIXES_REV }} with the fixes (built)
        if: env.OOREXX_FIXES == 'true'
        run: |
          export OOREXX_REV=$OOREXX_FIXES_REV OOREXX_INST=$RUNNER_TEMP/oorexx-inst
          export OOREXX_SRC=$RUNNER_TEMP/oorexx-src OOREXX_BUILD=$RUNNER_TEMP/oorexx-build
          cygpath -w "$(scripts/setup-oorexx.sh)" >> "$GITHUB_PATH"
          echo "ORXLUA_OOREXX_FIXES=1" >> "$GITHUB_ENV"
      - name: ooRexx r${{ env.OOREXX_REV }} (portable)
        if: env.OOREXX_FIXES != 'true'
        run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/oorexx.zip" \
            "$OOREXX_URL/oorexx-5.3.0-$OOREXX_REV.windows.x86_64-portable-release.zip"
          unzip -q "$RUNNER_TEMP/oorexx.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/oorexx-5.3.0-$OOREXX_REV.windows.x86_64-portable-release/bin" >> "$GITHUB_PATH"
      - run: rexx -v
      - name: Lua ${{ matrix.lua }}
        run: |
          echo "LUA_VERSION=${LUA_RELEASE%.*}" >> "$GITHUB_ENV"
          scripts/setup-lua.sh "$LUA_RELEASE"
      - name: ooRexxUnit
        run: scripts/setup-oorexxunit.sh
      - name: Build
        run: scripts/build.sh
      - name: Tests
        run: OUT=$RUNNER_TEMP/tests tests/run.sh
      - name: The Lua module in TeX Live's LuaTeX (Lua 5.3)
        if: env.LUA_VERSION == '5.3'
        run: |
          TEXLUA=$(scripts/setup-luatex.sh); "$TEXLUA" --version | head -1 || true
          ORXLUA_MODDIR=$(cd .. && pwd)/build/texlive LUA_EXE=$TEXLUA TESTS="Module.test.lua Lifetime.test.lua" \
            OUT=$RUNNER_TEMP/tests-luatex tests/run.sh
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then export ORXLUA_VERSION=${GITHUB_REF_NAME#v}; fi
          scripts/package.sh "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: oorexxlua-windows-x64-lua${{ env.LUA_VERSION }}
          path: ${{ runner.temp }}/dist/*.zip
      - name: The package, unzipped
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          unzip -q "$RUNNER_TEMP"/dist/*.zip
          D=$PWD/oorexxlua
          export PATH="$D:$PATH" REXX_PATH=$(cygpath -w "$D")
          cd .. && rexx "$(cygpath -w "$D/check.rex")"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true         # the logs are a help: GitHub's storage failing is not a test failing
        with:
          name: test-logs-windows-x64-lua${{ matrix.lua }}
          path: ${{ runner.temp }}/tests*

  release:
    if: github.ref_type == 'tag'
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: oorexxlua-*
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist; [ "$(ls dist/*.zip | wc -l)" -eq 12 ] || { echo "expected 12 packages"; exit 1; }
          pre=(); case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${pre[@]}" \
            --title "$GITHUB_REF_NAME" --generate-notes dist/*.zip
